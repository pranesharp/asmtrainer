  /* ------------------------------ progress ------------------------------- */

  var solved = [];
  try {
    var raw = window.localStorage.getItem(PROGRESS_KEY);
    if (raw) solved = JSON.parse(raw);
  } catch (e) { /* ignore */ }

  function markSolved(id) {
    if (solved.indexOf(id) >= 0) return;
    solved.push(id);
    try { window.localStorage.setItem(PROGRESS_KEY, JSON.stringify(solved)); } catch (e) { /* ignore */ }
    updateProgress();
  }

  function updateProgress() {
    var count = 0;
    for (var i = 0; i < DATA.problems.length; i++) {
      if (solved.indexOf(DATA.problems[i].id) >= 0) count++;
    }
    var el = document.getElementById("solvedCount");
    if (el) el.textContent = count + "/" + DATA.problems.length + " solved";
    var bar = document.getElementById("progBar");
    if (bar) bar.style.width = (count / DATA.problems.length) * 100 + "%";
    return count;
  }

  /* ---------------------------- editor wiring ---------------------------- */

  function wireEditor(ta, getVal, setVal) {
    ta.value = getVal();
    ta.addEventListener("input", function () { setVal(ta.value); });
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Tab") {
        e.preventDefault();
        var start = ta.selectionStart, end = ta.selectionEnd;
        setVal(getVal().slice(0, start) + "    " + getVal().slice(end));
        ta.value = getVal();
        requestAnimationFrame(function () { ta.selectionStart = ta.selectionEnd = start + 4; });
      }
    });
  }

  /* ----------------------------- badges ---------------------------------- */

  function unitBadge(u) { return '<span class="badge u' + u + '">UNIT ' + u + "</span>"; }
  function diffBadge(d) { return '<span class="obadge ' + d + '">' + d + "</span>"; }

  /* ============================ REFERENCE TAB ============================ */

  function instTable(rows) {
    var html = '<div class="tblwrap"><table class="inst"><thead><tr>' +
      "<th>Mnemonic</th><th>Format</th><th>Effect</th><th>Flags</th></tr></thead><tbody>";
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      html += "<tr><td class=\"mne\">" + esc(r.mnemonic) + '</td><td class="fmt">' + esc(r.format) +
        "</td><td>" + renderInline(r.effect) + '</td><td class="flg">' + esc(r.flags) + "</td></tr>";
    }
    return html + "</tbody></table></div>";
  }

  function refTab() {
    var R = DATA.ref;
    var html = '<div class="stack">';
    html += '<div class="masthead"><h2>The COA-8 machine &amp; instruction set</h2>' +
      "<p>Everything the Examples and Practice tabs use, on one page. The ISA follows the " +
      "two-operand GPR style from the Unit 4 slides — registers R0–R7, destination last, " +
      "the six addressing modes, and signed conditional branches driven by the N·Z·C·V " +
      "flags. Words are 16 bits; memory holds 256 words.</p></div>";

    html += '<div class="refcard"><p class="kick">machine model</p><h3>Registers, memory &amp; program structure</h3>' +
      '<div class="refgrid g2"><div class="machtext">' +
      "<p><b>8 registers</b> <code>R0…R7</code>, each holding one 16-bit word, plus the <b>program counter</b> and four <b>condition-code flags</b> N, Z, C, V.</p>" +
      "<p><b>Memory</b>: 256 words, addressed 0–255. Code and data share one address space; <code>ORG n</code> sets where the next item lands.</p>" +
      "<p><b>Data</b> is declared with <code>LABEL: DATAWORD v, v, …</code> (decimal, <code>0x</code> hex, <code>0b</code> binary, or a label expression like <code>LIST+2</code>). <code>LABEL EQU 12</code> names a constant.</p>" +
      "<p>Comments start with <code>--</code> (or <code>;</code>). Every instruction occupies one word — a simplified teaching model.</p>" +
      "</div><div>" + codeBlock(R.template, { showLineNumbers: false }) + "</div></div></div>";

    html += '<div class="refcard"><p class="kick">data transfer</p><h3>Move / Load / Store / Clear</h3>' + instTable(R.dataMove) + "</div>";
    html += '<div class="refcard"><p class="kick">arithmetic</p><h3>Add / Sub / Mul / counters</h3>' + instTable(R.arith) + "</div>";
    html += '<div class="refcard"><p class="kick">logic &amp; shifts (unit 3)</p><h3>And / Or / Xor / Not / shifts</h3>' + instTable(R.logic) + "</div>";
    html += '<div class="refcard"><p class="kick">control flow (unit 4)</p><h3>Compare, Test &amp; Branches</h3>' + instTable(R.compare) + "</div>";

    /* modes */
    var modes = '<div class="tblwrap"><table class="inst wide"><thead><tr>' +
      "<th>Mode</th><th>Syntax</th><th>Effective address</th><th>Example</th><th>Use it for</th></tr></thead><tbody>";
    for (var i = 0; i < R.modes.length; i++) {
      var m = R.modes[i];
      modes += '<tr><td style="font-weight:600;color:#22304a">' + esc(m.mode) + '</td><td class="syn">' +
        esc(m.syntax) + '</td><td class="ea">' + esc(m.ea) + '</td><td class="exm">' + esc(m.example) +
        "</td><td>" + esc(m.meaning) + "</td></tr>";
    }
    modes += "</tbody></table></div>";
    html += '<div class="refcard"><p class="kick">unit 4</p><h3>The six addressing modes</h3>' + modes + "</div>";

    /* conds + flags */
    var cond = '<div class="tblwrap"><table class="inst" style="min-width:420px"><thead><tr>' +
      "<th>Instruction</th><th>Branch is taken when</th></tr></thead><tbody>";
    for (var c = 0; c < R.conds.length; c++) {
      cond += '<tr><td class="mne">' + esc(R.conds[c].test) + '</td><td class="ea" style="white-space:normal">' +
        esc(R.conds[c].taken) + "</td></tr>";
    }
    cond += "</tbody></table></div>";
    var flags = '<div class="tblwrap"><table class="inst" style="min-width:0"><tbody>';
    for (var f = 0; f < R.flags.length; f++) {
      flags += '<tr><td class="syn" style="font-weight:700">' + esc(R.flags[f].test) +
        '</td><td style="white-space:normal">' + esc(R.flags[f].taken) + "</td></tr>";
    }
    flags += "</tbody></table></div>";
    html += '<div class="refcard"><p class="kick">unit 4</p><h3>Signed branch conditions &amp; the flags</h3>' +
      '<div class="refgrid g2">' + cond + flags + "</div>" +
      '<div class="notebox"><b>Why N vs V?</b> Signed comparisons need both: after <code>Compare R0, R1</code>, “R1 &lt; R0” is <code>N ≠ V</code> — this is exactly the branch-logic table from the Unit 4 condition-code slides.</div></div>';

    /* gotchas */
    var gots = '<div class="gotchas">';
    for (var g = 0; g < R.gotchas.length; g++) {
      gots += '<div class="gotcha"><div class="gt">' + esc(R.gotchas[g].title) + "</div><p>" +
        renderInline(R.gotchas[g].body) + "</p></div>";
    }
    gots += "</div>";
    html += '<div class="refcard"><p class="kick">read before debugging</p><h3>Six gotchas that cost marks</h3>' + gots + "</div>";

    html += "</div>";
    return html;
  }

  /* ============================ EXAMPLES TAB ============================= */

  function exampleCard(ex) {
    var ctl = new MachineCtl();
    var starterCells = E.assemble(ex.code).dataCells;
    var html = '<article class="card" data-exid="' + esc(ex.id) + '">' +
      '<div class="brow">' + unitBadge(ex.unit) + diffBadge(ex.difficulty) + "<h3>" + esc(ex.title) + "</h3></div>" +
      '<p class="kick">' + esc(ex.topic) + "</p>" +
      '<p class="stmt">' + renderInline(ex.statement) + "</p>" +
      '<div data-codeline>' + codeBlock(ex.code) + "</div>" +
      '<div class="concepts">';
      for (var i = 0; i < ex.concepts.length; i++) {
        html += '<span class="cbadge">' + esc(ex.concepts[i]) + "</span>";
      }
    html += "</div>";
    html += '<details class="plain"><summary>why it works</summary><div class="inner"><ul>';
      for (var j = 0; j < ex.explanation.length; j++) {
        html += "<li>" + renderInline(ex.explanation[j]) + "</li>";
      }
    html += "</ul></div></details>";
    html += '<div data-controls>' + traceControlsHTML("Run example", false, -1, -1) + "</div>";
    html += '<div data-panels></div>';
    html += "</article>";

    var root = document.createElement("div");
    root.innerHTML = html;
    var el = root.firstChild;
    var codeLineEl = el.querySelector("[data-codeline]");
    var wire = wireMachine(el, ctl,
      function () { return ex.code; },
      {
        showVerify: true,
        starterCells: function () { return starterCells; },
        codeLineEl: codeLineEl,
        onRun: function () { return ctl.run(ex.code, ex.checks); }
      });
    return el;
  }

  function examplesTab() {
    cards = [];
    var html = '<div class="stack">' +
      '<div class="masthead"><h2>Worked examples — fully open</h2>' +
      "<p>Ten complete programs, every line explained with a <code>--</code> statement. " +
      "Hit <b>Run example</b> to see it execute, then walk it with <b>next ▶ / ◀ back</b> — " +
      "the highlighted line, registers, flags and memory all move together. This is the best way " +
      "to <i>see</i> Unit 3 arithmetic and Unit 4 addressing modes in action.</p></div>" +
      '<div class="chips" data-exchips>' +
      chipBtn("exUnit", 0, "all units", true) +
      chipBtn("exUnit", 3, "unit 3 · arithmetic &amp; logic", false) +
      chipBtn("exUnit", 4, "unit 4 · instructions &amp; modes", false) +
      "</div>" +
      '<div data-exlist class="stack"></div></div>';
    var frag = document.createElement("div");
    frag.innerHTML = html;
    var wrap = frag.firstChild;
    renderExampleList(wrap.querySelector("[data-exlist]"));
    wireChips(wrap.querySelector("[data-exchips]"), "exUnit", function () {
      renderExampleList(wrap.querySelector("[data-exlist]"));
    });
    return wrap;
  }

  function renderExampleList(host) {
    host.innerHTML = "";
    var list = DATA.examples.filter(function (e) {
      return state.exUnit === 0 || e.unit === state.exUnit;
    });
    for (var i = 0; i < list.length; i++) {
      host.appendChild(exampleCard(list[i]));
    }
  }

  /* ============================ PRACTICE TAB ============================= */

  function problemCard(p) {
    var ctl = new MachineCtl();
    var isSolved = solved.indexOf(p.id) >= 0;
    var starterCells = E.assemble(p.starter).dataCells;
    var html = '<article class="card' + (isSolved ? " solved" : "") + '" data-pid="' + esc(p.id) + '">' +
      '<div class="brow">' + unitBadge(p.unit) + diffBadge(p.difficulty) +
      (isSolved ? '<span class="badge solv">✓ SOLVED</span>' : "") +
      "<h3>" + esc(p.title) + "</h3></div>" +
      '<p class="kick">' + esc(p.topic) + "</p>" +
      '<p class="stmt">' + renderInline(p.statement) + "</p>";

    html += '<div class="reqbox"><div class="rh">requirements</div><ul>';
    for (var i = 0; i < p.requirements.length; i++) {
      html += "<li>" + renderInline(p.requirements[i]) + "</li>";
    }
    html += "</ul>";
    var cons = p.constraints || {};
    if (cons.banned) {
      for (var b = 0; b < cons.banned.length; b++) {
        html += '<span class="conchip ban">⨯ no <b>' + esc(cons.banned[b].token) + "</b></span>";
      }
    }
    if (cons.required) {
      for (var q = 0; q < cons.required.length; q++) {
        var tok = cons.required[q].token === ")+ " ? " )+ " : cons.required[q].token;
        html += '<span class="conchip req">✓ must use <b>' + esc(tok) + "</b></span>";
      }
    }
    if (cons.maxSteps !== undefined) {
      html += '<span class="conchip max">≤ ' + cons.maxSteps + " instructions</span>";
    }
    html += "</div>";

    html += '<textarea class="editor" rows="14" spellcheck="false" aria-label="Assembly code editor" data-code></textarea>';
    html += '<div class="controls" style="margin-top:12px">' +
      '<button type="button" class="btn primary act-verify">▶ Run &amp; Verify</button>' +
      '<button type="button" class="btn act-reset">↺ reset code</button>' +
      '<span class="steps">write below the -- TODO lines · Tab indents</span></div>';
    html += '<div data-controls style="margin-top:12px">' + traceControlsHTML("Re-run", false, -1, -1) + "</div>";
    html += '<div data-panels></div>';

    /* hidden solution */
    html += '<details class="plain" style="margin-top:16px;margin-bottom:0"><summary>🔑 show solution — try at least one run before opening it</summary><div class="inner">' +
      codeBlock(p.solution) +
      '<div style="border:1px solid var(--inline);background:var(--w70);border-radius:8px;padding:12px 14px">' +
      '<div class="rh" style="font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#22304a;margin-bottom:6px">how it works</div><ul>';
    for (var s = 0; s < p.solutionNotes.length; s++) {
      html += "<li>" + renderInline(p.solutionNotes[s]) + "</li>";
    }
    html += "</ul></div></div></details>";
    html += "</article>";

    var root = document.createElement("div");
    root.innerHTML = html;
    var el = root.firstChild;
    var code = p.starter;
    var ta = el.querySelector("[data-code]");
    wireEditor(ta, function () { return code; }, function (v) { code = v; });

    function doRun() {
      var oc = ctl.run(code, p.checks, p.constraints);
      if (!oc) {
        toast("Assembler errors — fix the highlighted lines first.", "", false);
        return null;
      }
      var nChecks = oc.verification.results.length + oc.verification.constraintResults.length;
      if (oc.verification.allPass) {
        markSolved(p.id);
        el.classList.add("solved");
        if (!isSolved) {
          var brow = el.querySelector(".brow");
          if (!brow.querySelector(".badge.solv")) {
            brow.insertAdjacentHTML("beforeend", '<span class="badge solv">✓ SOLVED</span>');
          }
        }
        toast("Solved: " + p.title, "All " + nChecks + " checks passed in " + oc.run.stepsExecuted + " instructions.", true);
      } else {
        toast("Not quite yet", "Some checks failed — read the red rows for a hint.", false);
      }
      return oc;
    }

    el.querySelector(".act-verify").addEventListener("click", function () {
      doRun();
      wire.refreshNow();
      wire.syncActive();
    });
    el.querySelector(".act-reset").addEventListener("click", function () {
      code = p.starter;
      ta.value = code;
      ctl.reset();
      wire.refreshNow();
      wire.syncActive();
    });
    var wire = wireMachine(el, ctl, function () { return code; }, {
      showVerify: true,
      starterCells: function () { return starterCells; },
      onRun: doRun
    });
    return el;
  }

  function practiceTab() {
    cards = [];
    var html = '<div class="stack">' +
      '<div class="masthead"><h2>Practice problems — write &amp; verify</h2>' +
      "<p>Each problem gives you a statement, starter code and the machine&#39;s initial state. " +
      "Write your program in the box, press <b>Run &amp; Verify</b>, and the checker assembles your code, " +
      "executes it and compares the final registers and memory against the expected results — plus any " +
      "special rules (no <code>MUL</code>, use <code>(R0)+</code>, stay under N instructions). Stuck? A " +
      "hidden dropdown right below the question holds the full commented solution.</p></div>" +
      '<div class="chips" data-pchips>' +
      chipBtn("pUnit", 0, "all units", true) +
      chipBtn("pUnit", 3, "unit 3", false) +
      chipBtn("pUnit", 4, "unit 4", false) +
      '<span class="sep"></span>' +
      chipBtn("pDiff", "", "any level", true) +
      chipBtn("pDiff", "basic", "basic", false) +
      chipBtn("pDiff", "medium", "medium", false) +
      chipBtn("pDiff", "hard", "hard", false) +
      '<span class="sep"></span>' +
      chipBtn("pStatus", "", "all", true) +
      chipBtn("pStatus", "open", "unsolved", false) +
      chipBtn("pStatus", "solved", "solved", false) +
      "</div>" +
      '<div data-plist class="stack"></div></div>';
    var frag = document.createElement("div");
    frag.innerHTML = html;
    var wrap = frag.firstChild;
    renderProblemList(wrap.querySelector("[data-plist]"));
    wireChips(wrap.querySelector("[data-pchips]"), null, function () {
      renderProblemList(wrap.querySelector("[data-plist]"));
    });
    return wrap;
  }

  function renderProblemList(host) {
    host.innerHTML = "";
    var list = DATA.problems.filter(function (p) {
      if (state.pUnit !== 0 && p.unit !== state.pUnit) return false;
      if (state.pDiff !== "" && p.difficulty !== state.pDiff) return false;
      if (state.pStatus === "solved" && solved.indexOf(p.id) < 0) return false;
      if (state.pStatus === "open" && solved.indexOf(p.id) >= 0) return false;
      return true;
    });
    if (list.length === 0) {
      host.innerHTML = '<div class="empty">nothing matches these filters — nice progress though.</div>';
      return;
    }
    for (var i = 0; i < list.length; i++) {
      host.appendChild(problemCard(list[i]));
    }
  }

  /* =========================== PLAYGROUND TAB ============================ */

  var PLAYGROUND_TEMPLATE = "-- Free playground: the whole COA-8 ISA is available.\n" +
    "        ORG    0\n" +
    "        Move   #LIST, R0     -- pointer to the data\n" +
    "        Load   N, R1\n" +
    "        Clear  R2\n" +
    "LOOP:   Add    (R0)+, R2     -- sum with autoincrement\n" +
    "        Decrement R1\n" +
    "        Branch>0 LOOP\n" +
    "        Store  R2, SUM\n" +
    "        Halt\n" +
    "\n" +
    "N:      DATAWORD 4\n" +
    "LIST:   DATAWORD 10, 20, 30, 40\n" +
    "SUM:    DATAWORD 0";

  function playgroundTab() {
    var ctl = new MachineCtl();
    var code = PLAYGROUND_TEMPLATE;
    var starterCells = E.assemble(code).dataCells;
    var html = '<div class="card">' +
      '<div class="pghead"><h3>Free playground</h3>' +
      "<p>No checks, no rules — assemble anything, run it, and watch every register, flag and " +
      "memory cell change step by step. Great for testing exam ideas like “what does Branch≥0 do " +
      "after Compare with equal values?”.</p></div>" +
      '<textarea class="editor" rows="14" spellcheck="false" aria-label="Assembly code editor" data-code></textarea>' +
      '<div data-controls style="margin-top:12px">' + traceControlsHTML("Assemble &amp; Run", false, -1, -1) + "</div>" +
      '<div data-panels></div></div>';
    var root = document.createElement("div");
    root.innerHTML = html;
    var el = root.firstChild;
    var ta = el.querySelector("[data-code]");
    wireEditor(ta, function () { return code; }, function (v) { code = v; });

    var wire = wireMachine(el, ctl, function () { return code; }, {
      showVerify: false,
      starterCells: function () { return starterCells; },
      onRun: function () { return ctl.run(code, []); }
    });
    return el;
  }

  /* ------------------------------ tabs/chips ------------------------------ */

  var state = { tab: "examples", exUnit: 0, pUnit: 0, pDiff: "", pStatus: "" };

  function chipBtn(group, val, label, on) {
    return '<button type="button" class="chip' + (on ? " on" : "") + '" data-group="' + group +
      '" data-val="' + esc(String(val)) + '">' + label + "</button>";
  }

  function wireChips(host, fixedGroup, onChange) {
    var btns = host.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function (ev) {
        var b = ev.currentTarget;
        var group = b.getAttribute("data-group") || fixedGroup;
        var val = b.getAttribute("data-val");
        if (group === "exUnit") state.exUnit = parseInt(val, 10);
        else if (group === "pUnit") state.pUnit = parseInt(val, 10);
        else if (group === "pDiff") state.pDiff = val;
        else if (group === "pStatus") state.pStatus = val;
        var peers = host.querySelectorAll('.chip[data-group="' + group + '"]');
        for (var k = 0; k < peers.length; k++) peers[k].classList.toggle("on", peers[k] === b);
        onChange();
      });
    }
  }

  function renderTab() {
    var main = document.getElementById("main");
    cards = [];
    if (state.tab === "reference") main.innerHTML = refTab();
    else if (state.tab === "examples") { main.innerHTML = ""; main.appendChild(examplesTab()); }
    else if (state.tab === "practice") { main.innerHTML = ""; main.appendChild(practiceTab()); }
    else { main.innerHTML = ""; main.appendChild(playgroundTab()); }
    window.scrollTo(0, 0);
  }

  function init() {
    var nav = document.querySelectorAll("nav.tabs button");
    for (var i = 0; i < nav.length; i++) {
      nav[i].addEventListener("click", function (ev) {
        state.tab = ev.currentTarget.getAttribute("data-tab");
        var all = document.querySelectorAll("nav.tabs button");
        for (var k = 0; k < all.length; k++) all[k].classList.toggle("on", all[k] === ev.currentTarget);
        renderTab();
      });
    }
    updateProgress();
    renderTab();
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
